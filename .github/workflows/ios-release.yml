name: Build signed iOS release
on:
  push:
    branches:
      - 'ci/ios-release/**'

permissions:
  contents: read

jobs:
  ipa:
    if: ${{ !github.event.deleted }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          lfs: true
          persist-credentials: false

      - name: Install Flutter 3.44.8
        run: |
          git clone --quiet --depth 1 --branch 3.44.8 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 058e0af2c2b57e369d905a03ac9748b0ebf543c6
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Configure Ad Hoc signing
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: bash scripts/configure-ios-signing.sh

      - name: Build and verify IPA
        run: bash scripts/build-ios.sh

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ios-${{ github.sha }}
          path: app.ipa
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
