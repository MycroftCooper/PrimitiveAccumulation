name: primitive_accumulation
description: 本地优先的个人净资产盘点与成长手账。
publish_to: 'none'
version: 0.0.1+5002

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.6
  sqlite3: ^3.5.2
  path_drawing: ^1.0.1
  file_picker: ^13.4.1
  cryptography: ^2.9.0
  package_info_plus: ^10.2.2
  pub_semver: ^2.2.1
  http: ^1.6.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
